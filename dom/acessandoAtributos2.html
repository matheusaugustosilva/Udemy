<!DOCTYPE html>
<html>

<head>
    <meta charset='UTF-8'>
    <title>Acessando Atributos #02</title>
    <link rel='stylesheet' href='css/estilo.css'>
</head>

<body class='conteudo exercicio'>
    <div>
        <label for="compras">Compras</label>
        <ul id="compras" destino='escritório' data-urgencia="5">
            <li>Café</li>
            <li>Água</li>
            <li>Copo Descartável</li>
        </ul>
    </div>
    <script>
        const lista = document.querySelector('div ul[destino="escritório"]') // div que tenha uma ul com a propriedade destino cujo valor seja escritório 
        console.log("Elemento ul...........")
        console.log("ChildNodes",lista.childNodes)
        console.log("destino",lista.id)
        console.log("getAttribuite", lista.getAttribute("destino")) // nesse caso uso getAttribuite pq estou buscando um elemento personalizado que o navegador n conhece
        console.log("hasAttribuite",lista.hasAttribute("destino")) //lista tem o attribuite destino? 
        lista.setAttribute("destino", "empresa")
        lista.setAttribute("status", "aberto") // uso setAttribuite para mudar um elemento que já existe ou adcionar um novo elemento
        lista.removeAttribute("destino") 
        lista.dataset.urgencia = 4 //Atributos escritos como "data-" tem um comportamneto diferente
        console.log(lista.getAttribute('data-urgencia'))

        //cuidados  
        const label = document.querySelector('label')
        console.log(label.for) //não apareceu pq for já é uma palavra reservada, preciso mostrar que ele está no html
        console.log(label.htmlFor)
        console.log(label.getAttribute('for'))
    </script>
</body>

</html>
