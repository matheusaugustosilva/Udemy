<!DOCTYPE html>
<html>

<head>
    <meta charset='UTF-8'>
    <title>Modificando HTML #02</title>
    <link rel='stylesheet' href='css/estilo.css'>
</head>

<body class='conteudo exercicio'>
    <div>
        <p>Texto Inicial</p>
    </div>
    <script>
        const div = document.querySelector('div')
        div.innerHTML = "Texto aleterado" 
        //div.outerHTML = "Texto alterado"     substituindo o conteudo interno e o elementos
        div.insertAdjacentHTML('beforebegin', '<p>Antes início</p>') 
        div.insertAdjacentHTML('afterbegin','<p>Depois início</p>')
        div.insertAdjacentHTML('beforeend', '<p>Antes do fim</p>')
        div.insertAdjacentHTML('afterend', '<p>Depois do fim</p>')
        
        //somemto textos(sem tag)

        console.log(div.innerHTML)

    </script>
</body>

</html>
