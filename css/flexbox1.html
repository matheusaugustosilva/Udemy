<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Flexbox #01</title>
    <link rel="stylesheet" href="css/tag.css">
    <style>
        .big{font-size: 1.5em;}
        .flex-container{
            display: flex; /* utilizo flex para mexer em um elemento de forma unidimensional(vertical ou horizontal ) */
            flex-direction: column;
            flex-direction: row;
            width: 50%;
            flex-wrap: wrap; /* respeita a width definida e quebra para  outra linha */
            height: 200px;
            flex-flow: column wrap; /* mexo no direction e no wrap */
            flex-flow: row wrap;
            justify-content: flex-start;
            justify-content: flex-end;
            justify-content: center; /* serve para eu falar como o  conteudo sera distribuido  */
            justify-content: space-around;
            justify-content: space-between  ;

            flex-direction: row-reverse;
            justify-content: space-between;
            /* Cross Axis*/
            height: 400px;
            align-items: stretch; /* padrao */
            align-items: baseline; /* Alinha pela linha de base das fontes */
            align-items: flex-start; /* Alinha no start do flex */
            align-items: flex-end;
            align-items: center;    
            align-content: flex-start;
            align-content: flex-end;
        }
    </style>
</head>

<body>
    <div class="flex-container tag nolabel">
        <div class="tag nolabel">1</div>
        <div class="tag nolabel">2</div>
        <div class="tag nolabel big">3</div>
        <div class="tag nolabel">4</div>
        <div class="tag nolabel">5</div>
        <div class="tag nolabel">6</div>
        <div class="tag nolabel">7</div>
        <div class="tag nolabel">8</div>
        <div class="tag nolabel">9</div>
        <div class="tag nolabel">10</div>
    </div>
    <script src="js/tag.js"></script>
</body>

</html>
