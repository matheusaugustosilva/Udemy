<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Desafio Menu</title>
    <link href="https://fonts.googleapis.com/css?family=Oswald" rel="stylesheet">
    <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        body{ margin: 0; background-color: #a7a7a7; font-family: "Oswald"; font-size: 20px;}
        img{
            width: 300px;
            padding: 10px;
        }
        li{ display: inline-block; }
        .fa, button{
            display: none;
        }
        .cabecalho{
            background-color: #222;
            height: 100px;
        }
      .logo, .menu, .autenticacao{
        display: inline-block;
        vertical-align: middle;
      }
      .autenticacao{
        float: right;        
        
      }
      .botao{
        background-color: red;
        border-radius: 25px;
        padding: 10px;
      }
      .autenticacao{
        margin-top: 17px;
        padding: 10px;
      }
      .autenticacao a{
        text-decoration: none;
        color: white;
        padding: 10px;
    }
    .color{
        background: skyblue;
        width: 100%;
        height: 5px;
    }
    .menu a{
        text-decoration: none;
        color: white;
        margin-right: 20px;
        padding: 20px; 
        
    }
    .menu a:hover, .menu a.selected{
        background-color: skyblue;
        color: black;
    }
@media(max-width:810px){
    .fa, button{
        display: block;
        background-color: #757474;
        border-radius: 5px;
        float: right;
        margin: 10px;
       padding: 5px;
    }
}
@media(max-width:990px){
    .autenticacao{
        display: none;
    }
}
@media(max-width:810px){
    .menu{
        display: none;
    }
}       
    </style>
</head>

<body>
    <header class="cabecalho">
        <div class="logo">
            <a href="#inicio">
                <img src="http://files.cod3r.com.br/curso-web/logo.png" alt="Logo"/>
            </a>
        </div>
        <button class="menu-toggle">
            <i class="fa fa-lg fa-bars"></i> 
        </button>
        <nav class="menu">
            <ul>
                <li >
                    <a href="#inicio">Início</a>
                </li>
                <li >
                    <a href="#cursos">Cursos</a>
                </li>
                <li >
                    <a href="#sobre">Sobre</a>
                </li>
                <li >
                    <a href="#contato">Contato</a>
                </li>
            </ul>
        </nav>
        <aside class="autenticacao">
            <a href="#login">Login</a>
            <a href="#registar" class="botao destaque">Registrar</a>
        </aside>
    </header>
    <div class="color"></div>

    <script>
        // evento que detecta uma mudança no hash ...
        window.onhashchange = function(e){
            const oldURL = e.oldURL.split('#')[1] //pegar apenas o que está depois de #
            const newURL = e.newURL.split('#')[1]
            const oldMenu = document.querySelector(`.menu a[href='#${oldURL}']`) // pegar a hash que tenha .menu com o href #
            const newMenu = document.querySelector(`.menu a[href='#${newURL}']`)
            oldMenu && oldMenu.classList.remove("selected") // vou remover a class selected da oldMenu e adcionar no newMenu
            newMenu && newMenu.classList.add('selected')
        }
    </script>
    
</body>

</html>
