<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Texto</title>
    <link href="https://fonts.googleapis.com/css?family=Indie+Flower" rel="stylesheet">
    <style>
        /* ... */
        * {
            margin: 0;
        }
        html{
            font-size: 24px;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        div{
            font-size: 50px;
        }
        p{
            /* valores padroes */
            font-size: 1em; /* 1x tamanho padrao */
            font-size: 100%;
            font-size: 16px;
            font-size: 12pt;
        
            /* Unidades absolutas */
            font-size: 100px;
            font-size: 72pt; /* pontos */
            font-size: 1in; /* polegada */

            /* Unidades relativas */
            font-size: 2.2em;
            font-size: 2.2rem;
            font-size: 50vh;
            font-size: 10vw;

            font-family: monospace;
            font-family: Georgia, serif;
            font-family: Verdana, sans-serif;
            font-family: "indie Flower";
            font-weight: 100;
            font-style: italic;
            text-transform: uppercase;
            text-decoration: line-through;
            word-spacing: 10px;
            letter-spacing: 10px;


       
        }
        .botao{
            font-size: 28px;
            text-decoration: none;
            padding: 10px 30px;
            border-radius: 25px;
        }
        .destaque{ 
            color: white;
            background-color: tomato;
            box-shadow: 2px 2px 1px 1px #000;
            
        }
    </style>
</head>

<body>
    <div>
        <p>
            Que texto
            <br>legal!!!
        </p>
    </div>
    <a href="http://google.com" class="botao destaque">Google</a>
</body>

</html>
