<!DOCTYPE html>
<html>

<head>
    <meta charset='UTF-8'>
    <title>Axios #02</title>
    <link rel='stylesheet' href='css/estilo.css'>
    <script src="js/axios.js"></script>
</head>

<body class="conteudo exercicio">
    <h1>Axios Get/Post</h1>
    <div id="get"></div>
    <div id="post"></div>

    <script>
        function exbirRes(id, dados){
            const txt = JSON.stringify(dados)
            document.getElementById(id).innerHTML = txt
        }
 /*        axios.get("parOuImpar", {
            params: {
                numero:6
            }
        }).then(resp => exbirRes('get', resp.data)) */
        axios("parOuImpar?numero=3").then(resp => exbirRes('get', resp.data)) 

        axios.post('formulario', {
            nome: "João", 
            sobrenome: "Silva"  
        }).then(resp => exbirRes('post', resp.data))
    </script>
</body>
