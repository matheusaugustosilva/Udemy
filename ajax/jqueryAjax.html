<!DOCTYPE html>
<html>

<head>
    <meta charset='UTF-8'>
    <title>Ajax com jQuery</title>
    <link rel='stylesheet' href='css/estilo.css'>
    <script src="js/jquery.js"></script>
</head>

<body class="conteudo exercicio">
    <h1>jQuery Get/Post</h1>
    <div id="get"></div>
    <div id="post"></div>

    <script>
          function exibirRes(id, dados){
            const txt = JSON.stringify(dados)
            document.getElementById(id).innerHTML = txt
          }
        $.ajax({ // $ faz referência ao ajax
            url: 'parOuImpar', 
            data: { 
                numero: 6
            }, 
            success(data){
                exibirRes('get', data)
            }
        })
        $.ajax({
            url: "formulario", 
            method: 'post', 
            data: {
                nome: "João", 
                sobrenome: "Silva"
            },
            success(data){
                exibirRes("post", data)
            }, 
            error(e){
                exibirRes("post", e)
            }
        })
    </script>
</body>
